# 只启动融光工作站。不会创建、停止或替换已经在跑的 new-api 容器。
name: gateway-portal

services:
  portal:
    build: .
    image: gateway-portal:local
    container_name: gateway-portal
    restart: always
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEW_API_UPSTREAM: ${NEW_API_UPSTREAM:-host.docker.internal:3000}
      NEW_API_BASE: ${NEW_API_BASE:-http://host.docker.internal:3000}
      BFF_UPSTREAM: ${BFF_UPSTREAM:-127.0.0.1:8081}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATA_DIR: /data
    volumes:
      - rongguang-data:/data

volumes:
  rongguang-data:
